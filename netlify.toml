# Thirteen is a static SvelteKit app (adapter-static) — Netlify serves the
# prebuilt `build/` directory. The real-time game server deploys to Fly.io
# (see fly.toml + apps/server/Dockerfile; `fly launch` then `fly deploy`)
# and the web build points at it via VITE_GAME_WS_URL (see .env.example).

[build]
  command = "pnpm install --no-frozen-lockfile && pnpm --filter web build"
  publish = "apps/web/build"

[build.environment]
  NODE_VERSION = "24"
  # VITE_GAME_WS_URL is baked into the web build; without it the deployed app
  # falls back to same-origin /ws, which static hosting cannot proxy.
  VITE_GAME_WS_URL = "wss://thirteen-server.fly.dev/ws"
  # Unset, the app expects a same-origin /ws reverse proxy in front of the
  # game server (Netlify's plain static hosting cannot provide one).

# SPA fallback: unknown paths render the app shell; real files still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
